<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Inventario</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 min-h-screen">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-gray-200 hidden lg:flex flex-col">

      <!-- Logo -->
      <div class="p-6 border-b border-gray-200">

        <div class="flex items-center gap-3">

          <div class="bg-blue-600 p-2 rounded-lg">
            <i data-lucide="package" class="w-6 h-6 text-white"></i>
          </div>

          <div>
            <h1 class="text-lg font-semibold text-gray-900">
              Sistema de
            </h1>

            <p class="text-sm text-gray-600">
              Inventario
            </p>
          </div>

        </div>

      </div>

      <!-- Navegación -->
      <nav class="flex-1 p-4 space-y-1">

        <a
          href="dashboard.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>Dashboard</span>
        </a>

        <a
          href="inventario.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-50 text-blue-600 "
        >
          <i data-lucide="package" class="w-5 h-5"></i>
          <span>Inventario</span>
        </a>

        <a
          href="envios.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="truck" class="w-5 h-5"></i>
          <span>Envíos</span>
        </a>

        <a
          href="reportes.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span>Reportes</span>
        </a>

        <a
          href="perfil.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="user" class="w-5 h-5"></i>
          <span>Perfil</span>
        </a>

      </nav>

      <!-- Usuario -->
      <div class="p-4 border-t border-gray-200">

        <div class="bg-gray-50 rounded-lg p-3 mb-3">

          <div class="flex items-center gap-3">

            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center">
              <span class="text-white font-medium">
                U
              </span>
            </div>

            <div>
              <p class="text-sm font-medium text-gray-900">
                Usuario
              </p>

              <p class="text-xs text-gray-500">
                usuario@correo.com
              </p>
            </div>

          </div>

        </div>

        <button
          class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition"
        >
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span>Cerrar Sesión</span>
        </button>

      </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="flex-1">

      <div class="p-4 lg:p-8 max-w-7xl mx-auto space-y-6">

        <!-- Header -->
        <div class="flex items-center justify-between">

          <div>
            <h1 class="text-3xl font-semibold text-gray-900 mb-2">
              Inventario
            </h1>

            <p class="text-gray-600">
              Gestiona tus productos y stock
            </p>
          </div>

          <button
            onclick="handleOpenModal()"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2"
          >
            <i data-lucide="plus" class="w-5 h-5"></i>

            <span>Nuevo Producto</span>
          </button>

        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">

          <!-- Buscador -->
          <div class="relative mb-6">

            <i
              data-lucide="search"
              class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"
            ></i>

            <input
              type="text"
              id="search-input"
              placeholder="Buscar productos..."
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
            />

          </div>

          <!-- Tabla -->
          <div class="overflow-x-auto">

            <table class="w-full">

              <thead>
                <tr class="border-b border-gray-200">

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    SKU
                  </th>

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    Producto
                  </th>

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    Categoría
                  </th>

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    Stock
                  </th>

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    Precio
                  </th>

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    Estado
                  </th>

                  <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">
                    Última Modificación
                  </th>

                  <th class="text-right py-3 px-4 text-sm font-medium text-gray-600">
                    Acciones
                  </th>

                </tr>
              </thead>

              <tbody id="table-body"></tbody>

            </table>

          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- Modal -->
  <div
    id="product-modal"
    class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
  >

    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">

      <h2
        id="modal-title"
        class="text-2xl font-semibold text-gray-900 mb-6"
      >
        Nuevo Producto
      </h2>

      <form id="product-form" class="space-y-4">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Nombre
          </label>

          <input
            type="text"
            id="form-name"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            SKU
          </label>

          <input
            type="text"
            id="form-sku"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Categoría</label>
          <input type="text" id="form-category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Stock</label>
            <input type="number" id="form-stock" required class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Stock mínimo</label>
            <input type="number" id="form-minStock" required class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Precio</label>
          <input type="number" step="0.01" id="form-price" required class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nodo</label>
          <select id="form-node" disabled class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            <option value="Nodo PC1 - La Paz">Nodo PC1 - La Paz</option>
            <option value="Nodo PC2 - Réplica">Nodo PC2 - Réplica</option>
          </select>
        </div>

        <div class="flex gap-3 pt-4">

          <button
            type="button"
            onclick="handleCloseModal()"
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg"
          >
            Cancelar
          </button>

          <button
            type="submit"
            id="submit-btn"
            class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg"
          >
            Crear
          </button>

        </div>

      </form>
    </div>
  </div>
  
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/script_inventario.js"></script>
 
</body>
</html>
