<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Sistema de Inventario</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 min-h-screen">

  <div class="flex min-h-screen">

      <!-- sidebar -->    
    <div id="sidebar-container"></div>

    <!-- Contenedor Principal -->
    <div class="space-y-6 max-w-4xl mx-auto">

    <!-- Encabezado -->
    <div>
      <h1 class="text-3xl font-medium text-gray-900 mb-2">Mi Perfil</h1>
      <p class="text-gray-600">Gestiona tu información personal y configuración</p>
    </div>

    <!-- Contenedor de Alertas (Oculto por defecto) -->
    <div id="alert-box" class="hidden p-4 rounded-lg border font-medium"></div>

    <!-- Tarjeta de Banner y Stats -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <!-- Gradiente superior -->
      <div class="bg-gradient-to-r from-blue-500 to-blue-600 h-32"></div>
      
      <div class="px-6 pb-6">
        <div class="flex flex-col sm:flex-row items-center sm:items-end gap-6 -mt-16 mb-6">
          
          <!-- Avatar -->
          <div class="relative">
            <div class="w-32 h-32 bg-white rounded-full border-4 border-white shadow-lg flex items-center justify-center">
              <span id="avatar-initial" class="text-4xl font-bold text-blue-600">U</span>
            </div>
            <button class="absolute bottom-0 right-0 w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white hover:bg-blue-700 transition shadow-lg">
              <i data-lucide="camera" class="w-5 h-5"></i>
            </button>
          </div>
          
          <!-- Info de Usuario -->
          <div class="flex-1 text-center sm:text-left">
            <h2 id="display-name" class="text-2xl font-medium text-gray-900 mb-1">Nombre Usuario</h2>
            <p id="display-email" class="text-gray-600">usuario@ejemplo.com</p>
            <div class="flex items-center justify-center sm:justify-start gap-2 mt-2">
              <i data-lucide="shield" class="w-4 h-4 text-purple-600"></i>
              <span id="display-role" class="text-sm font-medium text-purple-600">Administrador</span>
            </div>
          </div>
        </div>

        <!-- Estadísticas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-6 border-t border-gray-200">
          <div class="bg-blue-50 rounded-lg p-4 text-center">
            <p class="text-2xl font-semibold text-blue-600 mb-1">245</p>
            <p class="text-sm font-medium text-gray-600">Acciones Realizadas</p>
          </div>
          <div class="bg-green-50 rounded-lg p-4 text-center">
            <p class="text-2xl font-semibold text-green-600 mb-1">98%</p>
            <p class="text-sm font-medium text-gray-600">Tasa de Precisión</p>
          </div>
          <div class="bg-purple-50 rounded-lg p-4 text-center">
            <p class="text-2xl font-semibold text-purple-600 mb-1">3 meses</p>
            <p class="text-sm font-medium text-gray-600">Tiempo Activo</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario de Información Personal -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-medium text-gray-900">Información Personal</h2>
        <button
          type="button"
          id="toggle-edit-btn"
          class="text-blue-600 font-medium hover:text-blue-700 text-sm"
        >
          Editar
        </button>
      </div>

      <form id="personal-info-form" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <div class="flex items-center gap-2 mb-2">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Nombre Completo</span>
              </div>
            </label>
            <input
              type="text"
              id="input-name"
              disabled
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none disabled:bg-gray-50 disabled:text-gray-600 transition"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <div class="flex items-center gap-2 mb-2">
                <i data-lucide="mail" class="w-4 h-4"></i>
                <span>Correo Electrónico</span>
              </div>
            </label>
            <input
              type="email"
              id="input-email"
              disabled
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none disabled:bg-gray-50 disabled:text-gray-600 transition"
            />
          </div>
        </div>

        <div id="save-info-container" class="hidden pt-4 border-t border-gray-200">
          <button
            type="submit"
            class="bg-blue-600 text-white font-medium px-6 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2"
          >
            <i data-lucide="save" class="w-5 h-5"></i>
            <span>Guardar Cambios</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Formulario de Cambio de Contraseña -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-xl font-medium text-gray-900 mb-6">Cambiar Contraseña</h2>
      <form id="password-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="lock" class="w-4 h-4"></i>
              <span>Contraseña Actual</span>
            </div>
          </label>
          <input
            type="password"
            id="input-current-password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nueva Contraseña</label>
            <input
              type="password"
              id="input-new-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
              placeholder="••••••••"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar Contraseña</label>
            <input
              type="password"
              id="input-confirm-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <div class="pt-4">
          <button
            type="submit"
            class="bg-blue-600 text-white font-medium px-6 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2"
          >
            <i data-lucide="lock" class="w-5 h-5"></i>
            <span>Actualizar Contraseña</span>
          </button>
        </div>
      </form>

      </div>

    </main>

  </div>

  <script src="assets/js/components.js"></script>
  <script src="assets/js/script_perfil.js"></script>
  <script src="assets/js/auth.js"></script>

</body>
</html>
