<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-gray-200 hidden lg:flex flex-col">

      <!-- Logo -->
      <div class="p-6 border-b border-gray-200">

        <div class="flex items-center gap-3">

          <div class="bg-blue-600 p-2 rounded-lg">
            <i data-lucide="package" class="w-6 h-6 text-white"></i>
          </div>

          <div>
            <h1 class="text-lg font-semibold text-gray-900">
              Sistema de
            </h1>

            <p class="text-sm text-gray-600">
              Inventario
            </p>
          </div>

        </div>

      </div>

      <!-- Navegación -->
      <nav class="flex-1 p-4 space-y-1">

        <a
          href="dashboard.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-50 text-blue-600"
        >
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>Dashboard</span>
        </a>

        <a
          href="inventario.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="package" class="w-5 h-5"></i>
          <span>Inventario</span>
        </a>

        <a
          href="envios.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="truck" class="w-5 h-5"></i>
          <span>Envíos</span>
        </a>

        <a
          href="reportes.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span>Reportes</span>
        </a>

        <a
          href="perfil.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <i data-lucide="user" class="w-5 h-5"></i>
          <span>Perfil</span>
        </a>

      </nav>

      <!-- Usuario -->
      <div class="p-4 border-t border-gray-200">

        <div class="bg-gray-50 rounded-lg p-3 mb-3">

          <div class="flex items-center gap-3">

            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center">
              <span class="text-white font-medium">
                U
              </span>
            </div>

            <div>
              <p class="text-sm font-medium text-gray-900">
                Usuario
              </p>

              <p class="text-xs text-gray-500">
                usuario@correo.com
              </p>
            </div>

          </div>

        </div>

        <button
          onclick="cerrarSesion()"
          class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition"
        >
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span>Cerrar Sesión</span>
        </button>

      </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="flex-1 p-4 lg:p-8">

      <div class="max-w-7xl mx-auto space-y-8">

        <!-- Header -->
        <div>

          <h1 class="text-3xl font-bold text-gray-900 mb-2">
            Dashboard
          </h1>

          <p class="text-gray-600">
            Resumen general del sistema de inventario
          </p>

        </div>

        <!-- Stats -->
        <div
          id="stats-container"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"
        ></div>

        <!-- Secciones -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Actividad -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">

            <h2 class="text-xl font-semibold text-gray-900 mb-4">
              Actividad Reciente
            </h2>

            <div
              id="activity-container"
              class="space-y-4"
            ></div>

          </div>

          <!-- Stock Bajo -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">

            <div class="flex items-center justify-between mb-4">

              <h2 class="text-xl font-semibold text-gray-900">
                Productos con Stock Bajo
              </h2>

              <span
                id="alerts-count"
                class="bg-orange-100 text-orange-600 text-xs px-3 py-1 rounded-full"
              >
              </span>

            </div>

            <div
              id="low-stock-container"
              class="space-y-3"
            ></div>

          </div>

        </div>

      </div>

    </main>

  </div>

  <script>

    // Inicializar Iconos
    lucide.createIcons();

    // Datos
    const stats = [
      {
        name: 'Total Productos',
        value: '1,234',
        change: '+12%',
        changeType: 'increase',
        icon: 'package',
        color: 'bg-blue-500'
      },

      {
        name: 'Usuarios Activos',
        value: '45',
        change: '+8%',
        changeType: 'increase',
        icon: 'users',
        color: 'bg-green-500'
      },

      {
        name: 'Valor Inventario',
        value: '$125,430',
        change: '+15%',
        changeType: 'increase',
        icon: 'trending-up',
        color: 'bg-purple-500'
      },

      {
        name: 'Stock Bajo',
        value: '23',
        change: '-5%',
        changeType: 'decrease',
        icon: 'alert-triangle',
        color: 'bg-orange-500'
      },
    ];

    const recentActivity = [
      {
        id: 1,
        action: 'Nuevo producto agregado',
        item: 'Laptop Dell XPS 15',
        time: 'Hace 5 minutos'
      },

      {
        id: 2,
        action: 'Stock actualizado',
        item: 'Mouse Logitech MX Master',
        time: 'Hace 15 minutos'
      },

      {
        id: 3,
        action: 'Producto vendido',
        item: 'Teclado Mecánico RGB',
        time: 'Hace 1 hora'
      },

      {
        id: 4,
        action: 'Nuevo usuario registrado',
        item: 'María González',
        time: 'Hace 2 horas'
      },

      {
        id: 5,
        action: 'Alerta de stock bajo',
        item: 'Monitor Samsung 27"',
        time: 'Hace 3 horas'
      },
    ];

    const lowStockProducts = [
      {
        id: 1,
        name: 'Monitor Samsung 27"',
        stock: 3,
        min: 10,
        category: 'Monitores'
      },

      {
        id: 2,
        name: 'Teclado Mecánico',
        stock: 5,
        min: 15,
        category: 'Periféricos'
      },

      {
        id: 3,
        name: 'Webcam Logitech C920',
        stock: 2,
        min: 8,
        category: 'Accesorios'
      },

      {
        id: 4,
        name: 'Cable HDMI 2m',
        stock: 7,
        min: 20,
        category: 'Cables'
      },
    ];

    // STATS
    const statsContainer = document.getElementById('stats-container');

    stats.forEach(stat => {

      const arrowIcon =
        stat.changeType === 'increase'
          ? 'arrow-up'
          : 'arrow-down';

      const arrowColor =
        stat.changeType === 'increase'
          ? 'text-green-600'
          : 'text-red-600';

      const card = `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">

          <div class="flex items-center justify-between mb-4">

            <div class="${stat.color} p-3 rounded-lg">
              <i data-lucide="${stat.icon}" class="w-6 h-6 text-white"></i>
            </div>

            <div class="flex items-center gap-1">

              <i data-lucide="${arrowIcon}" class="w-4 h-4 ${arrowColor}"></i>

              <span class="text-sm ${arrowColor}">
                ${stat.change}
              </span>

            </div>

          </div>

          <h3 class="text-2xl font-bold text-gray-900 mb-1">
            ${stat.value}
          </h3>

          <p class="text-sm text-gray-600">
            ${stat.name}
          </p>

        </div>
      `;

      statsContainer.insertAdjacentHTML('beforeend', card);
    });

    // ACTIVIDAD
    const activityContainer =
      document.getElementById('activity-container');

    recentActivity.forEach(activity => {

      const item = `
        <div class="flex items-start gap-3 pb-4 border-b border-gray-100">

          <div class="w-2 h-2 bg-blue-500 rounded-full mt-2"></div>

          <div class="flex-1">

            <p class="text-sm font-medium text-gray-900">
              ${activity.action}
            </p>

            <p class="text-sm text-gray-600">
              ${activity.item}
            </p>

            <p class="text-xs text-gray-500 mt-1">
              ${activity.time}
            </p>

          </div>

        </div>
      `;

      activityContainer.insertAdjacentHTML('beforeend', item);
    });

    // STOCK BAJO
    const lowStockContainer =
      document.getElementById('low-stock-container');

    document.getElementById('alerts-count').textContent =
      `${lowStockProducts.length} alertas`;

    lowStockProducts.forEach(product => {

      const item = `
        <div class="flex items-center justify-between p-3 bg-orange-50 rounded-lg border border-orange-100">

          <div class="flex-1">

            <p class="text-sm font-medium text-gray-900">
              ${product.name}
            </p>

            <p class="text-xs text-gray-600">
              ${product.category}
            </p>

          </div>

          <div class="text-right">

            <p class="text-sm font-medium text-orange-600">
              Stock: ${product.stock}
            </p>

            <p class="text-xs text-gray-500">
              Mín: ${product.min}
            </p>

          </div>

        </div>
      `;

      lowStockContainer.insertAdjacentHTML('beforeend', item);
    });

    // Recargar iconos dinámicos
    lucide.createIcons();

  </script>
  <script src="assets/js/auth.js"></script>

</body>
</html>
